<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - الإعدادات</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <aside class="sidebar">
            <h2 class="logo">لوحة التحكم</h2>

            <nav>
                <a href="index.html">🏠 الرئيسية</a>
                <a href="users.html">👥 المستخدمون</a>
                <a href="settings.html" class="active">⚙️ الإعدادات</a>
            </nav>
        </aside>

        <main class="main-content">

            <header class="page-header">
                <h1>إعدادات الحساب</h1>
                <p>يمكنك تعديل اسم المستخدم وكلمة المرور.</p>
            </header>

            <section class="content-box form-box">
                <h2>تعديل البيانات</h2>

                <form action="#">
                    <div class="form-group">
                        <label for="username">اسم المستخدم</label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="أدخل اسم المستخدم"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">كلمة المرور</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="أدخل كلمة المرور الجديدة"
                            required
                        >
                    </div>

                    <button type="submit" class="save-button">
                        حفظ التغييرات
                    </button>
                </form>

            </section>

        </main>
    </div>

</body>
</html>
